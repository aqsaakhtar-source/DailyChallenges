<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Contact // Aqsa</title><meta name=description content="UI design portfolio: 30 Daily UI challenges"><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600&display=swap" rel=stylesheet><link rel=stylesheet href=style.css></head><body data-p=contact><main>
<p class=eyebrow>// Open channel</p><h2>Contact</h2><p class=sub>Got a project or just want to say hi? Send a transmission.</p>
<div class=two><form id=cf class=reveal><div><label>NAME</label><input name=n required></div><div><label>EMAIL</label><input name=e type=email required></div><div><label>MESSAGE</label><textarea name=m rows=6 required></textarea></div><button class=btn style=margin:0>Transmit</button></form>
<div class="box reveal"><h3>Direct line</h3><p class=sub style=margin:14px 0 24px data-me=email></p><h3>Networks</h3><p style=margin-top:12px><span id=links></span></p></div></div></main><script src=app.js></script></body></html>
