<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Settings // Aqsa</title><meta name=description content="UI design portfolio: 30 Daily UI challenges"><link rel=preconnect href=https://fonts.googleapis.com><link rel=preconnect href=https://fonts.gstatic.com crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;600&display=swap" rel=stylesheet><link rel=stylesheet href=style.css></head><body data-p=settings><main>
<p class=eyebrow>// System config</p><h2>Settings</h2><p class=sub>Tune the interface. Saved on this device.</p>
<div style=margin-top:30px;max-width:720px>
<div class=row><div><b class=mono>ACCENT COLOR</b><br><small style=color:var(--m)>Primary neon tone</small></div><div class=dots><button data-c=#00f0ff></button><button data-c=#ff2bd6></button><button data-c=#fcee0a></button><button data-c=#39ff14></button></div></div>
<div class=row><div><b class=mono>SCANLINES + GLITCH</b><br><small style=color:var(--m)>CRT overlay and glitch FX</small></div><button class=sw data-k=fx aria-label="Toggle effects"></button></div>
<div class=row><div><b class=mono>NEON CURSOR</b><br><small style=color:var(--m)>Custom cursor on desktop</small></div><button class=sw data-k=cursor aria-label="Toggle cursor"></button></div>
<div class=row><div><b class=mono>PARTICLE NETWORK</b><br><small style=color:var(--m)>Interactive background</small></div><button class=sw data-k=particles aria-label="Toggle particles"></button></div>
<div class=row><div><b class=mono>REDUCE MOTION</b><br><small style=color:var(--m)>Calmer animations</small></div><button class=sw data-k=reduce aria-label="Reduce motion"></button></div>
<button class=btn id=reset>Reset to default</button></div></main><script src=app.js></script></body></html>
